<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloub — Council Actions Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: #f4f4f2; color: #111; text-align: center; padding: 16px 12px 24px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p.sub { font-size: 13px; color: #666; margin: 0 0 12px; }
  #stage { background: #f9f9f9; border-radius: 24px; max-width: 340px; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  #blob { width: 100%; height: auto; display: block; }
  #status { font-size: 13px; color: #555; min-height: 20px; margin: 10px 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; margin: 10px auto 0; }
  button { font: inherit; font-size: 14px; padding: 9px 14px; border-radius: 999px; border: 1px solid #ddd; background: #fff; color: #111; cursor: pointer; }
  button.active { background: #111; color: #fff; border-color: #111; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px #ddd; }
  .swatch.active { box-shadow: 0 0 0 2px #111; }
  .lbl { font-size: 12px; color: #888; margin-top: 14px; }
</style>
</head>
<body>
<h1>Bloub — one demo</h1>
<p class="sub">Tap each option and compare — pick one per action.</p>
<div id="stage"><svg id="blob" role="img" aria-label="Bloub mascot"></svg></div>
<div id="status"></div>
<div class="row">
  <button data-action="idle">Idle</button>
  <button data-action="thinking">Thinking</button>
  <button data-action="speaking">Speaking</button>
  <button data-action="verdict">Verdict</button>
</div>
<div class="lbl">Agree — tap each, pick your favourite</div>
<div class="row">
  <button data-action="agree1">Agree 1 · Happy bounce</button>
  <button data-action="agree2">Agree 2 · Excited</button>
  <button data-action="agree3">Agree 3 · Laughing</button>
</div>
<div class="lbl">Confused — tap each, pick your favourite</div>
<div class="row">
  <button data-action="confused1">Confused 1 · Thinking hard</button>
  <button data-action="confused2">Confused 2 · Wide-eyed</button>
  <button data-action="confused3">Confused 3 · Suspicious</button>
</div>
<div class="lbl">Disagree — tap each, pick your favourite</div>
<div class="row">
  <button data-action="disagree1">Disagree 1 · Unimpressed</button>
  <button data-action="disagree2">Disagree 2 · Suspicious</button>
  <button data-action="disagree3">Disagree 3 · Cold stare</button>
</div>
<div class="lbl">Advisor colour</div>
<div class="row">
  <button class="swatch" data-color="ink" style="background:#0a0a0c" title="Ink"></button>
  <button class="swatch" data-color="contrarian" style="background:#e8483f" title="Contrarian"></button>
  <button class="swatch" data-color="first" style="background:#3b93f0" title="First Principles"></button>
  <button class="swatch" data-color="expansionist" style="background:#3ecf8e" title="Expansionist"></button>
  <button class="swatch" data-color="outsider" style="background:#f0b429" title="Outsider"></button>
  <button class="swatch" data-color="executor" style="background:#8b5cf6" title="Executor"></button>
</div>
